name: Build Android APK (REALISASI RAWAT)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 3. Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Siapkan Folder Web (www)
        run: |
          mkdir -p www
          cp index.html www/
          find . -maxdepth 1 \( -name "*.js" -o -name "*.css" -o -name "*.png" -o -name "*.jpg" -o -name "*.jpeg" -o -name "*.svg" -o -name "*.json" \) ! -name "package*.json" ! -name "capacitor.config.json" -exec cp {} www/ \;

      - name: 5. Install & Inisialisasi Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "REALISASI RAWAT" "com.kencana.realisasirawat" --web-dir=www
          npx cap add android

      - name: 6. Pasang Logo Kencana sebagai Ikon Aplikasi Android
        run: |
          if [ -f "logo-kencana.png" ]; then
            sudo apt-get update && sudo apt-get install -y imagemagick
            for dir in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
              TARGET_DIR="android/app/src/main/res/$dir"
              mkdir -p "$TARGET_DIR"
              convert logo-kencana.png -background white -gravity center -resize 192x192 -extent 240x240 "$TARGET_DIR/ic_launcher.png"
              cp "$TARGET_DIR/ic_launcher.png" "$TARGET_DIR/ic_launcher_round.png"
              cp "$TARGET_DIR/ic_launcher.png" "$TARGET_DIR/ic_launcher_foreground.png"
            done
            rm -rf android/app/src/main/res/mipmap-anydpi-v26
          fi

      - name: 7. Tambahkan Izin Internet & Penyimpanan
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET" \/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" \/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" \/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" \/>\n    <application/' $MANIFEST

      - name: 8. Sync & Build Debug APK
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 9. Upload Hasil APK
        uses: actions/upload-artifact@v4
        with:
          name: REALISASI-RAWAT-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
