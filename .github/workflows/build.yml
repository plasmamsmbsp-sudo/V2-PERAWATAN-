name: Build Android APK (Capacitor)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 3. Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Siapkan Folder Web (www)
        run: |
          mkdir -p www
          # Menyalin index.html dan aset pendukung (png, jpg, css, js, json) jika ada di root
          cp index.html www/
          find . -maxdepth 1 \( -name "*.js" -o -name "*.css" -o -name "*.png" -o -name "*.jpg" -o -name "*.jpeg" -o -name "*.svg" -o -name "*.json" \) ! -name "package*.json" ! -name "capacitor.config.json" -exec cp {} www/ \;

      - name: 5. Install & Inisialisasi Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "IPD Plasma" "com.kencana.ipdplasma" --web-dir=www
          npx cap add android

      - name: 6. Tambahkan Izin GPS & Penyimpanan di AndroidManifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's/<application/<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" \/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" \/>\n    <uses-permission android:name="android.permission.INTERNET" \/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" \/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" \/>\n    <application/' $MANIFEST

      - name: 7. Sync & Build Debug APK
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 8. Upload Hasil APK
        uses: actions/upload-artifact@v4
        with:
          name: App-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
